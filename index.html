<style>
  :root {
    --bg: #051115;
    --surface: rgba(9, 28, 34, 0.92);
    --surface-hi: rgba(12, 38, 46, 0.95);
    --ink: #02080a;
    --border: #d7ebe5;
    --teal: #0d3f4a;
    --mint: #5ef2c0;
    --text: #eef7f4;
    --muted: #84a7a2;
    --display: "Pixelify Sans", ui-monospace, monospace;
    --hud: "VT323", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html {
    scrollbar-width: none;
    -ms-overflow-style: none;
    -webkit-text-size-adjust: 100%;
  }
  html::-webkit-scrollbar { display: none; }
  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: var(--hud);
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    overflow-x: hidden;
  }
  ::selection { background: var(--mint); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }

  #dither-bg,
  #spark-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
  #dither-bg { z-index: 0; image-rendering: pixelated; }
  .bg-vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(circle at 50% 45%, transparent 34%, rgba(3, 10, 13, 0.64) 100%);
  }
  #spark-canvas { z-index: 20; }

  .sheet {
    position: relative;
    z-index: 2;
    max-width: 1160px;
    min-height: 100dvh;
    margin: 0 auto;
    padding: clamp(24px, 5vw, 60px) clamp(18px, 4vw, 52px);
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    grid-template-rows: auto 1fr;
    gap: 28px 20px;
    align-content: start;
    align-items: start;
  }

  /* Row 1: Cols 1-9 Giant Display, Cols 10-12 Clock */
  .masthead { grid-column: 1 / 10; min-width: 0; }
  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(3.8rem, 12.2vw, 9.4rem);
    line-height: 0.82;
    letter-spacing: -0.03em;
    color: var(--text);
    text-shadow: 6px 6px 0 var(--ink);
  }
  h1 span { color: var(--mint); }

  .stamp-box {
    grid-column: 10 / 13;
    justify-self: end;
    border: 2px solid var(--border);
    background: var(--surface);
    box-shadow: 5px 5px 0 var(--ink);
    padding: 9px 14px;
    text-align: right;
    font-size: 18px;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .stamp-box b {
    display: block;
    font-family: var(--display);
    font-size: 15px;
    color: var(--mint);
  }

  /* Row 2 Left: Avatar Sticker + Brand Logos (Cols 1-4) */
  .sticker-col {
    grid-column: 1 / 5;
    margin-top: 8px;
    min-width: 0;
  }
  .cat-sticker {
    position: relative;
    width: min(268px, 100%);
    aspect-ratio: 1;
    border: 3px solid var(--border);
    background: var(--teal);
    box-shadow: 8px 8px 0 var(--ink), 12px 12px 0 rgba(94, 242, 192, 0.22);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.16s, border-color 0.16s;
  }
  .cat-sticker img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    image-rendering: pixelated;
  }
  .peel-corner {
    position: absolute;
    top: 0;
    right: 0;
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 0 36px 36px 0;
    border-color: transparent var(--bg) transparent transparent;
    transition: border-width 0.18s ease-out;
  }
  .peel-corner::after {
    content: "";
    position: absolute;
    top: 0;
    right: -36px;
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 36px 0 0 36px;
    border-color: transparent transparent transparent var(--mint);
    filter: drop-shadow(-2px 2px 0 var(--ink));
  }
  @media (hover: hover) {
    .cat-sticker:hover {
      transform: translate(-3px, -4px) rotate(-1.5deg);
      border-color: var(--mint);
      box-shadow: 10px 10px 0 var(--ink), 15px 15px 0 rgba(94, 242, 192, 0.35);
    }
    .cat-sticker:hover .peel-corner { border-width: 0 50px 50px 0; }
    .cat-sticker:hover .peel-corner::after { right: -50px; border-width: 50px 0 0 50px; }
  }

  .meta-tags {
    margin-top: 20px;
    display: grid;
    gap: 10px;
    max-width: 268px;
  }
  .meta-line {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 21px;
    color: var(--text);
    line-height: 1.15;
    text-decoration: none;
    min-width: 0;
  }
  a.meta-line:hover span:last-child {
    color: var(--mint);
    text-decoration: underline;
  }
  .logo-badge {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
  }
  .logo-badge img {
    width: 22px;
    height: 22px;
    display: block;
    border-radius: 3px;
    border: 1px solid rgba(215, 235, 229, 0.28);
    object-fit: cover;
  }
  .logo-badge svg {
    width: 20px;
    height: 20px;
    color: var(--mint);
  }

  /* Row 2 Right: Offset Thesis + Socials (Cols 6-12, Col 5 empty!) */
  .channels-col {
    grid-column: 6 / 13;
    margin-top: clamp(14px, 5vh, 52px);
    min-width: 0;
  }
  .thesis-card {
    background: var(--surface-hi);
    color: var(--text);
    border: 3px solid var(--border);
    box-shadow: 8px 8px 0 var(--mint);
    padding: 20px 24px;
    margin-bottom: 24px;
  }
  .thesis-card .lbl {
    font-size: 16px;
    color: var(--mint);
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .thesis-card p {
    font-family: var(--hud);
    font-size: clamp(25px, 3.2vw, 35px);
    line-height: 1.15;
    letter-spacing: 0.01em;
  }

  .ch-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }
  .ch-slot {
    display: grid;
    grid-template-columns: 40px minmax(0, 1fr) auto;
    align-items: center;
    gap: 13px;
    padding: 12px 14px;
    min-height: 66px;
    background: var(--surface);
    border: 2px solid rgba(215, 235, 229, 0.72);
    box-shadow: 5px 5px 0 var(--ink);
    color: var(--text);
    text-decoration: none;
    text-align: left;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s, background 0.1s, color 0.1s, border-color 0.1s;
  }
  .ch-slot.wide { grid-column: 1 / -1; }
  .ch-slot > div { min-width: 0; }
  .slot-ico {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    background: var(--teal);
    color: var(--mint);
    border: 2px solid var(--mint);
    flex-shrink: 0;
  }
  .slot-ico svg { width: 22px; height: 22px; }
  .slot-title {
    font-family: var(--display);
    font-weight: 700;
    font-size: 19px;
    line-height: 1.1;
  }
  .slot-sub {
    font-size: 18px;
    color: var(--muted);
    line-height: 1.15;
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .slot-act {
    font-family: var(--display);
    font-weight: 700;
    font-size: 16px;
    color: var(--mint);
    flex-shrink: 0;
  }

  @media (hover: hover) {
    .ch-slot:hover {
      background: var(--mint);
      border-color: var(--mint);
      color: var(--ink);
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0 var(--ink);
    }
    .ch-slot:hover .slot-ico { background: var(--ink); border-color: var(--ink); color: var(--mint); }
    .ch-slot:hover .slot-sub { color: #0a2228; }
    .ch-slot:hover .slot-act { color: var(--ink); }
  }
  .ch-slot:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }

  /* Tablet: compact side-by-side profile row + 2-col channels */
  @media (max-width: 900px) {
    .sheet { gap: 24px 16px; grid-template-rows: none; min-height: auto; }
    .masthead { grid-column: 1 / 8; }
    .stamp-box { grid-column: 8 / 13; }
    .sticker-col {
      grid-column: 1 / -1;
      margin-top: 0;
      display: grid;
      grid-template-columns: 184px minmax(0, 1fr);
      gap: 20px;
      align-items: center;
    }
    .cat-sticker { width: 184px; }
    .meta-tags { margin-top: 0; max-width: none; }
    .channels-col { grid-column: 1 / -1; margin-top: 4px; }
  }

  /* Mobile: compact header, snug avatar+logos row, 1-col touch cards */
  @media (max-width: 600px) {
    .sheet { padding: 20px 16px 32px; gap: 18px 12px; }
    .masthead { grid-column: 1 / -1; }
    .stamp-box {
      grid-column: 1 / -1;
      justify-self: start;
      text-align: left;
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 7px 12px;
    }
    .sticker-col {
      grid-template-columns: 128px minmax(0, 1fr);
      gap: 14px;
    }
    .cat-sticker {
      width: 128px;
      box-shadow: 5px 5px 0 var(--ink), 8px 8px 0 rgba(94, 242, 192, 0.22);
    }
    .peel-corner { border-width: 0 24px 24px 0; }
    .peel-corner::after { right: -24px; border-width: 24px 0 0 24px; }
    .meta-tags { gap: 8px; }
    .meta-line { font-size: 19px; gap: 8px; }
    .thesis-card { padding: 16px 18px; box-shadow: 6px 6px 0 var(--mint); margin-bottom: 18px; }
    .ch-grid { grid-template-columns: 1fr; gap: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cat-sticker, .peel-corner, .ch-slot { transition: none !important; }
  }
</style>
</head>

<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fine = matchMedia('(pointer: fine)').matches;

  // Live Shanghai clock
  const clockEl = document.getElementById('clock');
  const fmt = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
  });
  const tickClock = () => { clockEl.textContent = fmt.format(new Date()); };
  tickClock();
  setInterval(tickClock, 1000);

  // Copy Gmail with fallback
  const mailBtn = document.getElementById('copy-mail');
  const mailAct = document.getElementById('mail-act');
  let copyTimer = null;
  mailBtn.addEventListener('click', () => {
    try { navigator.clipboard?.writeText('xeronsh@gmail.com'); } catch {}
    mailAct.textContent = 'COPIED!';
    if (copyTimer) clearTimeout(copyTimer);
    copyTimer = setTimeout(() => { mailAct.textContent = 'COPY'; }, 1500);
  });

  // Scramble thesis on avatar click
  const thesisEl = document.getElementById('scramble-thesis');
  const finalStr = 'Build tools. Bet on my own thesis.';
  let scramRaf = 0;
  function scramble() {
    if (reduced) return;
    if (scramRaf) cancelAnimationFrame(scramRaf);
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$*';
    const t0 = performance.now();
    (function step(now) {
      const p = Math.min(1, (now - t0) / 480);
      const r = Math.floor(p * finalStr.length);
      let out = '';
      for (let i = 0; i < finalStr.length; i++) {
        out += (finalStr[i] === ' ' || finalStr[i] === '.') ? finalStr[i]
          : (i < r ? finalStr[i] : chars[(Math.random() * chars.length) | 0]);
      }
      thesisEl.textContent = out;
      if (p < 1) scramRaf = requestAnimationFrame(step);
      else thesisEl.textContent = finalStr;
    })(t0);
  }
  document.getElementById('cat-sticker').addEventListener('click', scramble);

  // Optimized Bayer Dither Wave Canvas (Uint32Array + trig LUT + 30fps cap)
  const bgCanvas = document.getElementById('dither-bg');
  const bgCtx = bgCanvas.getContext('2d', { alpha: false });
  const bayer = new Float32Array([
    0/16,  8/16,  2/16, 10/16,
    12/16, 4/16, 14/16,  6/16,
    3/16, 11/16,  1/16,  9/16,
    15/16, 7/16, 13/16,  5/16
  ]);

  // Little-endian ABGR packed colors
  const COL_BG   = 0xff151105; // #051115
  const COL_TEAL = 0xd24a3f0d; // rgba(13,63,74,0.82) blended over #051115 -> solid #0b333b
  const COL_TEAL_SOLID = 0xff3b330b;
  const COL_MINT = 0xff8c9d3b; // soft luminous mint-teal highlight near pointer

  let dw = 0, dh = 0, step = 8;
  let imgData = null, buf32 = null, sinX = null, cosY = null;
  let mx = -9999, my = -9999;

  function resizeBg() {
    step = window.innerWidth < 640 ? 10 : 8;
    dw = Math.max(1, Math.ceil(window.innerWidth / step));
    dh = Math.max(1, Math.ceil(window.innerHeight / step));
    bgCanvas.width = dw;
    bgCanvas.height = dh;
    bgCanvas.style.width = '100%';
    bgCanvas.style.height = '100%';
    imgData = bgCtx.createImageData(dw, dh);
    buf32 = new Uint32Array(imgData.data.buffer);
    sinX = new Float32Array(dw);
    cosY = new Float32Array(dh);
    drawDither(performance.now());
  }

  function drawDither(now) {
    const t = now * 0.0011;
    for (let x = 0; x < dw; x++) sinX[x] = Math.sin(x * 0.09 + t) * 0.5;
    for (let y = 0; y < dh; y++) cosY[y] = Math.cos(y * 0.09 - t * 0.7) * 0.5;

    const smx = mx / step, smy = my / step;
    const rad = 20, radSq = rad * rad;

    for (let y = 0; y < dh; y++) {
      const cy = cosY[y];
      const dy = y - smy;
      const dySq = dy * dy;
      const rowOff = y * dw;
      const bRow = (y & 3) << 2;

      for (let x = 0; x < dw; x++) {
        let prox = 0;
        if (fine && dySq < radSq) {
          const dx = x - smx;
          const dSq = dx * dx + dySq;
          if (dSq < radSq) prox = (1 - Math.sqrt(dSq) / rad) * 0.55;
        }
        const val = (sinX[x] + cy + 1) * 0.24 + prox;
        const on = val > bayer[bRow + (x & 3)];
        buf32[rowOff + x] = on ? (prox > 0.14 ? COL_MINT : COL_TEAL_SOLID) : COL_BG;
      }
    }
    bgCtx.putImageData(imgData, 0, 0);
  }

  if (fine) {
    window.addEventListener('pointermove', (e) => { mx = e.clientX; my = e.clientY; }, { passive: true });
    document.addEventListener('pointerleave', () => { mx = -9999; my = -9999; });
  }

  let resizeTid = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTid);
    resizeTid = setTimeout(resizeBg, 80);
  }, { passive: true });
  resizeBg();

  if (reduced) return;

  // 30fps loop, pauses automatically when tab is hidden
  let lastFrame = 0, ditherRaf = 0;
  function ditherLoop(now) {
    if (!document.hidden) {
      if (now - lastFrame >= 33) {
        lastFrame = now;
        drawDither(now);
      }
      ditherRaf = requestAnimationFrame(ditherLoop);
    }
  }
  ditherRaf = requestAnimationFrame(ditherLoop);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      lastFrame = performance.now();
      ditherRaf = requestAnimationFrame(ditherLoop);
    } else {
      cancelAnimationFrame(ditherRaf);
    }
  });

  // On-demand ClickSpark (0% CPU when idle!)
  const spCanvas = document.getElementById('spark-canvas');
  const spCtx = spCanvas.getContext('2d');
  let sw = 0, sh = 0, spRaf = 0;
  const sparks = [];

  function resizeSp() {
    sw = spCanvas.width = window.innerWidth;
    sh = spCanvas.height = window.innerHeight;
  }
  resizeSp();
  window.addEventListener('resize', resizeSp, { passive: true });

  function sparkLoop() {
    spCtx.clearRect(0, 0, sw, sh);
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.vy += 0.12;
      s.life -= 0.045;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      spCtx.globalAlpha = s.life;
      spCtx.fillStyle = s.color;
      spCtx.fillRect(Math.round(s.x), Math.round(s.y), 6, 6);
    }
    spCtx.globalAlpha = 1;
    if (sparks.length > 0) spRaf = requestAnimationFrame(sparkLoop);
    else { spRaf = 0; spCtx.clearRect(0, 0, sw, sh); }
  }

  window.addEventListener('pointerdown', (e) => {
    for (let i = 0; i < 12; i++) {
      const a = (Math.PI * 2 * i) / 12 + Math.random() * 0.25;
      const v = 2.4 + Math.random() * 3.4;
      sparks.push({
        x: e.clientX, y: e.clientY,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        life: 1,
        color: i % 2 === 0 ? '#5ef2c0' : '#eef7f4'
      });
    }
    if (!spRaf) spRaf = requestAnimationFrame(sparkLoop);
  }, { passive: true });
})();
</script>
</body>
</html>
